<style>
html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: a survey route. A fixed station list on the left, one station's lesson at a time on the right.
   Progress is written as a detection history (1 = station finished, 0 = not yet). */
:root{
  --bg:#f7f4ec;--surface:#ffffff;--ink:#17261a;--muted:#55645a;--line:#d8d6c8;
  --forest:#1b3a1b;--moss:#3e6b4d;--gold:#8a6a12;--goldfill:#f3e7bf;--tint:#e8eee4;
  --pass:#1f6b3d;--passfill:#dcefe2;--open:#8a3b12;--openfill:#f8e4d6;--on-forest:#f7f4ec;--on-forest-muted:#b9c9bb;--code:#eef0e6;
  --display:'Playfair Display',Georgia,serif;--body:'Source Sans 3',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111812;--surface:#19221b;--ink:#e9ece4;--muted:#a3b1a6;--line:#324036;
  --forest:#0c150d;--moss:#8fbf9c;--gold:#dcbd63;--goldfill:#3a3216;--tint:#212c23;
  --pass:#86d3a2;--passfill:#163524;--open:#f0a981;--openfill:#40240f;--on-forest:#f0efe6;--on-forest-muted:#9fb0a2;--code:#232d25;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111812;--surface:#19221b;--ink:#e9ece4;--muted:#a3b1a6;--line:#324036;
  --forest:#0c150d;--moss:#8fbf9c;--gold:#dcbd63;--goldfill:#3a3216;--tint:#212c23;
  --pass:#86d3a2;--passfill:#163524;--open:#f0a981;--openfill:#40240f;--on-forest:#f0efe6;--on-forest-muted:#9fb0a2;--code:#232d25;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--body)}
a{color:var(--moss);text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.shell{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100vh}
.rail{background:var(--forest);color:var(--on-forest);padding:24px 18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font:700 1.3rem/1.2 var(--display);margin:0}
.brand-sub{color:var(--on-forest-muted);font-size:.86rem;margin:4px 0 14px}
.history{font:600 .78rem/1.5 var(--mono);letter-spacing:.09em;color:var(--on-forest);overflow-wrap:anywhere;margin:0}
.history-label{font-size:.78rem;color:var(--on-forest-muted);margin:0 0 14px}
.stations{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.stations a{display:grid;grid-template-columns:1.9em 1fr auto;gap:4px;padding:6px 8px;border-radius:5px;color:var(--on-forest);text-decoration:none;font-size:.93rem;line-height:1.3}
.stations a:hover{background:rgba(255,255,255,.08)}
.stations a[aria-current="page"]{background:rgba(255,255,255,.15);font-weight:600}
.stations .n{font:400 .76rem/1.7 var(--mono);color:var(--on-forest-muted)}
.stations .d{font:600 .78rem/1.6 var(--mono);color:var(--on-forest-muted)}
.stations .done .d{color:#e6c766}
.rail-tools{margin-top:16px;display:grid;gap:8px;font-size:.88rem}
.rail-tools label{display:flex;gap:8px;align-items:center;color:var(--on-forest)}
.rail-tools .copy{color:var(--ink)}
.main{padding-block:32px 64px;padding-left:max(16px,4vw);padding-right:max(16px,4vw);min-width:0}
.lesson{max-width:800px;margin:0 auto;display:grid;gap:22px}
.lesson>*{min-width:0}
.eyebrow{font:600 .78rem/1.3 var(--mono);letter-spacing:.06em;color:var(--gold);text-transform:uppercase;margin:0}
h1{font:700 clamp(1.9rem,4.6vw,2.7rem)/1.13 var(--display);margin:4px 0 0;text-wrap:balance}
h2{font:600 1.45rem/1.2 var(--display);margin:12px 0 0;text-wrap:balance}
h3{font:700 1.04rem/1.3 var(--body);margin:0}
p{margin:0;max-width:68ch}
ul,ol{margin:0;padding-left:1.25em;display:grid;gap:6px;max-width:68ch}
.lead{font-size:1.14rem;color:var(--muted)}
.stack{display:grid;gap:10px}
code{font:400 .86em var(--mono);background:var(--code);padding:.08em .32em;border-radius:3px;overflow-wrap:anywhere}
.small{font-size:.9rem;color:var(--muted)}
.cmd{display:flex;gap:8px;align-items:flex-start;background:var(--code);border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-width:0}
.cmd pre{margin:0;flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;font:400 .87rem/1.45 var(--mono)}
.copy{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:2px 9px;font-size:.8rem;cursor:pointer}
.copy:hover{border-color:var(--moss)}
.task{background:var(--tint);border-radius:8px;padding:16px;display:grid;gap:10px}
.task>h3::before{content:"Do this  ";font:600 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-right:6px}
.note{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:6px;background:var(--surface)}
.note.warn{background:var(--openfill);border-color:transparent}
.instr{background:var(--goldfill);border-radius:8px;padding:12px 14px;display:grid;gap:6px;font-size:.95rem}
.instr>strong{font:600 .74rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
body:not(.teach) .instr{display:none}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th{text-align:left;font-weight:700;border-bottom:2px solid var(--line);padding:6px 8px;vertical-align:bottom}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font:600 .7rem/1.5 var(--mono);padding:0 7px;border-radius:9px;white-space:nowrap}
.chip.DONE,.chip.PASS{background:var(--passfill);color:var(--pass)}
.chip.OPEN,.chip.FAIL{background:var(--openfill);color:var(--open)}
figure{margin:0;display:grid;gap:6px}
figure img{background:#fff;border:1px solid var(--line);border-radius:6px;display:block;width:100%;max-width:640px}
figcaption{font-size:.88rem;color:var(--muted);max-width:68ch}
.steps{counter-reset:s;list-style:none;padding:0;display:grid;gap:8px;max-width:none}
.steps>li{counter-increment:s;display:grid;grid-template-columns:2em minmax(0,1fr);gap:4px 8px}
.steps>li::before{content:counter(s);font:700 1.05rem/1.5 var(--display);color:var(--gold)}
.steps>li>*{grid-column:2}
.steps>li>:first-child{grid-column:2;grid-row:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:5px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--moss);color:var(--bg);font-weight:600}
.check{display:grid;gap:7px;list-style:none;padding:0;max-width:none}
.check label{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;align-items:start;cursor:pointer}
.check input{margin-top:5px;accent-color:var(--moss)}
.quiz{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);display:grid;gap:8px}
.quiz .q{font-weight:600}
.quiz .opts{display:grid;gap:6px}
.quiz button.opt{text-align:left;border:1px solid var(--line);background:transparent;border-radius:6px;padding:7px 10px;cursor:pointer;overflow-wrap:anywhere}
.quiz button.opt:hover{border-color:var(--moss)}
.quiz button.opt.right{background:var(--passfill);border-color:var(--pass)}
.quiz button.opt.wrong{background:var(--openfill);border-color:var(--open)}
.quiz .why{font-size:.94rem}
.cards{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:13px 14px;display:grid;gap:7px;min-width:0}
.card h3 code{background:transparent;padding:0;font-weight:600;font-size:.94rem}
.card dl{margin:0;display:grid;grid-template-columns:5.6em minmax(0,1fr);gap:3px 10px;font-size:.95rem}
.card dt{color:var(--muted);font-size:.86rem;padding-top:1px}
.card dd{margin:0;min-width:0}
.tools-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search],input[type=text],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;max-width:100%}
input[type=search]{width:min(100%,320px)}
textarea{width:100%}
.btn{border:1px solid var(--moss);background:var(--moss);color:var(--bg);font-weight:600;border-radius:6px;padding:7px 15px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--moss)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px;align-items:center}
.lab{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.lab label{display:grid;gap:2px;font-size:.9rem}
.lab output{font:600 .92rem var(--mono)}
input[type=range]{width:100%;accent-color:var(--moss)}
.labviz text{fill:var(--muted);font:11px var(--body)}
.labviz .truth{stroke:var(--gold);stroke-width:2}
.labviz .ax{stroke:var(--line)}
.dotm{fill:var(--moss)}.dotn{fill:var(--open)}
.flow{list-style:none;padding:0;margin:0;display:grid;gap:0;max-width:none}
.flow li{display:grid;grid-template-columns:2.1em minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.flow .k{font:700 1.05rem/1.4 var(--display);color:var(--gold)}

.shot figcaption .tag{font:600 .7rem var(--mono);color:var(--gold);text-transform:uppercase;letter-spacing:.05em;margin-right:6px}
.shot img{max-width:760px}
.mock{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px;display:grid;gap:10px;font-size:.9rem;max-width:720px;min-width:0}
.mock-prompt{border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mock-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mock-ctl{border:1px solid var(--line);border-radius:6px;padding:3px 9px;white-space:nowrap}
.mock-ctl small{display:block;font-size:.68rem;color:var(--muted);line-height:1.2}
.hot{outline:2px solid var(--gold);outline-offset:1px;background:var(--goldfill);font-weight:600}
.mock-list{list-style:none;margin:0;padding:0;display:grid;gap:3px;max-width:none;border:1px solid var(--line);border-radius:8px;padding:6px}
.mock-list li{padding:4px 8px;border-radius:5px;overflow-wrap:anywhere}
.mock-split{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:12px}
.mock-pane{border:1px solid var(--line);border-radius:8px;padding:9px;display:grid;gap:6px;align-content:start;min-width:0}
.mock-h{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mock-tabs{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .stations{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

@media (prefers-reduced-motion:no-preference){.lesson{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}

<div class="shell">
<nav class="rail" aria-label="Course stations">
  <p class="brand">CascadiaTools Field Course</p>
  <p class="brand-sub">Tutorial for the Oregon Chapter of The Wildlife Society. Taal Levi, <a href="https://cascadiawildlifelab.org/tools/" style="color:inherit">CascadiaTools, Cascadia Wildlife Lab</a>.</p>

<template id="t-welcome">
  <p class="eyebrow">Start here</p>
  <h1>Run an analysis you can defend, in plain language</h1>
  <p class="lead">No experience with Claude is needed. You will meet Claude and its models, install CascadiaTools in the Claude desktop app, learn every slash command, and run worked examples on your own laptop.</p>
  <div class="note"><h3>By the end you will be able to</h3>
    <ul><li>Explain what Claude is, what it gets wrong, and which of its models to pick.</li>
    <li>Install the plugin, confirm it works, and keep your projects organized.</li>
    <li>Choose among 29 analysis modules, and read a DONE or OPEN verdict correctly.</li>
    <li>Use all 14 CascadiaTools slash commands and the commands that manage plugins.</li>
    <li>Run an analysis from question to report, and check it instead of taking it on trust.</li>
    <li>Make figures for a journal, plan a study by simulation, and protect sensitive locations.</li></ul></div>
  <h2>How the course works</h2>
  <p>Each station has a short explanation, something to do in Claude, and a check question. Finish a station and it flips to 1 in the detection history at the top left. A browser remembers your progress on that device only; nothing is sent anywhere.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Block</th><th>Stations</th><th>What you do</th></tr></thead><tbody>
  <tr><td>Meet Claude</td><td>1 and 2</td><td>What Claude is, and why validated tools matter</td></tr>
  <tr><td>Get ready</td><td>3 to 6</td><td>Install, tour the app, choose a model, manage projects</td></tr>
  <tr><td>Know the tools</td><td>7 and 8</td><td>Browse the analysis modules, learn every command</td></tr>
  <tr><td>Analyze</td><td>9 to 12</td><td>Wood Thrush counts, the planted-truth lab, pileated woodpecker occupancy, other taxa</td></tr>
  <tr><td>Finish the job</td><td>13 to 15</td><td>Figures, power analysis, private mode</td></tr>
  <tr><td>Your data</td><td>16 and 17</td><td>Write your own prompt, keep the cheat sheet</td></tr>
  </tbody></table></div>
  <div class="note"><h3>Do before the tutorial</h3><p>Package installation takes 20 to 40 minutes and cannot happen on conference Wi-Fi with everyone at once. Please finish the <a href="#install">Install station</a> beforehand.</p></div>
  <div class="note warn"><h3>Every example dataset here is simulated</h3><p>Simulated data let us compare each estimate with the known truth. No result in this course describes a real population.</p></div>
  <div class="instr"><strong>Instructor</strong><p>The full schedule, pre-work email and rehearsal list are in the <a href="#instructor">instructor station</a>. Turn on instructor notes in the left panel while you present, and off for attendees.</p></div>
</template>

<template id="t-meet">
  <p class="eyebrow">Station 1 · 15 minutes</p>
  <h1>Meet Claude</h1>
  <p class="lead">Claude is an AI system made by Anthropic. You give it instructions in everyday language, and it reads, reasons, writes and, in the desktop app, can work with files and run programs on your computer.</p>
  <p>Think of a fast, very widely read new technician. Claude has read a great deal about occupancy models, and it can write R in seconds. It also hasn't seen your study area, can misunderstand you, and can state a wrong answer as confidently as a right one. You would check a new technician's work, and the same applies here.</p>
  <h2>Three ways to work in the app</h2>
  <div class="shot" data-shot="code-tab"></div>
  <p class="small">Where these appear depends on your version of the app. Look for labeled tabs, or for icons at the top left: a speech bubble for chat and &lt;/&gt; for code.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Tab</th><th>What it is for</th><th>Example</th></tr></thead><tbody>
  <tr><td><strong>Chat</strong></td><td>A conversation. Ask questions, draft text, think something through.</td><td>"Explain closure in an N-mixture model."</td></tr>
  <tr><td><strong>Cowork</strong></td><td>Multi-step knowledge work across files you choose.</td><td>"Turn these field notes into a season summary."</td></tr>
  <tr><td><strong>Code</strong></td><td>Claude Code. It works in a project folder and can run programs such as R. <strong>CascadiaTools runs here.</strong></td><td>"Fit an occupancy model to these detections."</td></tr>
  </tbody></table></div>
  <h2>What it does well, and where it fails</h2>
  <div class="tbl-wrap"><table><thead><tr><th>Good at</th><th>Be careful about</th></tr></thead><tbody>
  <tr><td>Writing and explaining code, and fixing it from error messages</td><td>Wrong statistics that run without error. CascadiaTools exists for this.</td></tr>
  <tr><td>Summarizing and restructuring long documents</td><td>Invented details. Always look up any citation it gives you.</td></tr>
  <tr><td>Following a written procedure step by step</td><td>Recent events. Current models have a reliable knowledge cutoff of June 2026.</td></tr>
  <tr><td>Explaining a method at the level you ask for</td><td>Agreeing with you too easily. Ask it to argue the other side.</td></tr>
  </tbody></table></div>
  <h2>Words you will hear today</h2>
  <div class="tbl-wrap"><table><tbody>
  <tr><td><strong>Model</strong></td><td>The AI itself. Claude comes in several models, from faster to more capable.</td></tr>
  <tr><td><strong>Prompt</strong></td><td>What you type to Claude.</td></tr>
  <tr><td><strong>Session</strong></td><td>One conversation in the Code tab, with its own history.</td></tr>
  <tr><td><strong>Context</strong></td><td>What Claude can hold in mind during a session. It fills up in long sessions.</td></tr>
  <tr><td><strong>Agent</strong></td><td>Claude working through steps on its own: reading files, running commands, checking results.</td></tr>
  <tr><td><strong>Skill</strong></td><td>A written procedure Claude follows. You can start one with a slash command.</td></tr>
  <tr><td><strong>Plugin</strong></td><td>An add-on that bundles skills and tools. CascadiaTools is a plugin.</td></tr>
  <tr><td><strong>Marketplace</strong></td><td>A list of plugins you can install from.</td></tr>
  <tr><td><strong>Usage limits</strong></td><td>How much work your plan allows over time. Larger models and long jobs use more.</td></tr>
  </tbody></table></div>
  <div class="task"><h3>Find Claude's edge</h3><p>In a Chat, send the message below. Then look up one of its citations. This takes two minutes and teaches the most important habit in this course.</p>
  <div class="cmd"><pre>Give me three peer-reviewed papers, with full citations, on how snow depth affects Pacific marten occupancy in Oregon. Tell me how confident you are that each one exists.</pre></div></div>
  <div class="note"><h3>Your data</h3><p>Whatever Claude reads or prints is sent to Anthropic to generate a response. Don't paste sensitive locations into any tab. <a href="#private">Private mode</a> covers this in detail, and your institution may have its own terms.</p></div>
  <div class="quiz" data-q="meet1"></div>
  <div class="instr"><strong>Instructor</strong><p>Ask who has used Claude or ChatGPT, then pitch to the newest people in the room. The citation exercise tends to change how people read everything after it. Results vary, so try it yourself first, and don't promise it will invent a paper.</p></div>
</template>

<template id="t-why">
  <p class="eyebrow">Station 1</p>
  <h1>Why not just ask Claude to do the analysis?</h1>
  <p class="lead">You can. It will write plausible code, and it will usually run. Ecological models fail silently, so a model that ran is weak evidence that the answer is right.</p>
  <p>An occupancy model with too few surveys can return an occupancy of 1.00 with a tiny standard error. An N-mixture model on data that break closure can return abundance ten times too high with good-looking intervals. Neither prints an error.</p>
  <h2>The R package analogy</h2>
  <p>You trust <code>unmarked</code> without reading its source because it was written once, published, tested and used by many people. New code written by an AI for each request has none of that history. CascadiaTools gives agents the same arrangement: vetted code, used the same way each time.</p>
  <div class="tbl-wrap"><table><thead><tr><th></th><th>Fresh code from a chat</th><th>A CascadiaTools module</th></tr></thead><tbody>
  <tr><td>Statistical code</td><td>Written anew each time</td><td>Written once, tested, independently verified</td></tr>
  <tr><td>Shown to work?</td><td>Rarely tested</td><td>Simulation recovery recorded in <code>VALIDATION.md</code></td></tr>
  <tr><td>Known limits</td><td>Unknown</td><td>Written down, with numbers</td></tr>
  <tr><td>At your design?</td><td>Not checked</td><td>Planted-truth check at your sites, visits and detection</td></tr>
  <tr><td>When it can't be trusted</td><td>You may never hear</td><td>Verdict of OPEN, with the reason</td></tr>
  </tbody></table></div>
  <h2>What happens in every analysis</h2>
  <ol class="flow">
    <li><span class="k">1</span><div><strong>Your files are checked</strong> and described back to you. You confirm or correct.</div></li>
    <li><span class="k">2</span><div><strong>A short plan is written</strong> before any fit: the question, the model, the covariates and why.</div></li>
    <li><span class="k">3</span><div><strong>Planted truth.</strong> Data like yours are simulated with known answers, and the method must recover them.</div></li>
    <li><span class="k">4</span><div><strong>Your data are fitted,</strong> then checked for convergence and goodness of fit.</div></li>
    <li><span class="k">5</span><div><strong>You get a report:</strong> interpretation with intervals, figures, a methods paragraph, and a verdict of DONE or OPEN.</div></li>
  </ol>
  <div class="note"><h3>What stays your job</h3><p>You own the question, the biology and the study design. You read what the agent says it is doing, and you confirm the data description. CascadiaTools checks the statistics at your design. It cannot know that your observers changed protocol in June unless you say so.</p></div>
  <div class="quiz" data-q="why1"></div>
  <div class="instr"><strong>Instructor</strong><p>Audience resistance to AI is the point of this station, so raise it yourself. The manuscript's argument: nobody audits every line of <code>unmarked</code>; we rely on validation and community checking. Show one <code>VALIDATION.md</code> from the repository, then the <a href="https://cascadiawildlifelab.org/tools/validation.html">validation page</a>.</p></div>
</template>

<template id="t-model">
  <p class="eyebrow">Station 5 · 10 minutes</p>
  <h1>Choose a Claude model</h1>
  <p class="lead">The model is the AI doing the work. You can leave it on the default for this whole course. Change it when a job is unusually simple or unusually hard.</p>
  <h2>Where to select it</h2>
  <div class="shot" data-shot="session-row"></div>
  <div class="shot" data-shot="model-picker"></div>
  <p>The <strong>model picker</strong> is toward the right end of the row under the prompt box, and it shows the current model and effort, such as "Opus 5.5 High". Click it to choose a model. <strong>Effort</strong> opens from the same menu, and <strong>More models</strong> lists others. You can change the model during a session, type <code>/model</code>, or press Cmd+Shift+I on a Mac.</p>
  <h2>The current models</h2>
  <div class="tbl-wrap"><table><thead><tr><th>Model</th><th>The app's menu says</th><th>Anthropic's model docs say</th><th>Speed</th><th class="num">API price per million tokens (in / out)</th><th>Suggested use with CascadiaTools</th></tr></thead><tbody>
  <tr><td><strong>Fable 5.1</strong></td><td>For your toughest challenges</td><td>For demanding reasoning and long-horizon agentic work</td><td>Slower</td><td class="num">$10 / $50</td><td>A new module, or a hard multi-day problem</td></tr>
  <tr><td><strong>Opus 5.5</strong></td><td>For complex work and everyday tasks</td><td>For long-running agentic coding and knowledge work</td><td>Moderate</td><td class="num">$4 / $20</td><td><strong>Everyday analyses. The default, and what we rehearsed with.</strong></td></tr>
  <tr><td><strong>Sonnet 5.5</strong></td><td>Most efficient for simpler tasks</td><td>The best combination of speed and intelligence</td><td>Fast</td><td class="num">$2 / $10</td><td>Figures, write-ups, follow-up runs of a set analysis</td></tr>
  <tr><td><strong>Haiku 5.5</strong></td><td>Fastest for quick answers</td><td>For high-volume, latency-sensitive tasks such as classification, extraction and routing</td><td>Fastest</td><td class="num">From $0.10 / $0.50</td><td>Quick questions and simple file tidying</td></tr>
  </tbody></table></div>
  <p class="small">Descriptions and prices are from Anthropic's models overview, November 2026. Models change, so check <a href="https://platform.claude.com/docs/en/about-claude/models/overview">the current list</a>. The last column is our suggestion, and only Opus 5.5 was rehearsed. Plan subscribers don't pay these prices directly, but larger models use up plan limits faster. Your account may list other models under <strong>More models</strong>.</p>
  <div class="note"><h3>Does the model change my statistics?</h3><p>The fitted numbers come from R, using module code that is the same whichever model is selected. What the model changes is how well the agent chooses a module, reads your data, follows the protocol and explains the result. Check its work on any model.</p></div>
  <h2>Effort</h2>
  <p>Effort sets how hard the model thinks before acting, and higher levels use more of your limits. Anthropic's advice is to use the default for most tasks. When a result disappoints, ask: did it not <em>try</em> hard enough, or did it not <em>know</em> enough? If it skipped a check, raise the effort. If it tried and was still wrong, move to a larger model. First check that your prompt was clear.</p>
  <h2>Two things to know about Fable</h2>
  <ul>
    <li><strong>Limits.</strong> Depending on your plan, Fable can draw on usage credits, and Anthropic's docs say the model picker marks it "Requires usage credits" when it does.</li>
    <li><strong>Biology flags.</strong> Fable's safety checks most often flag cybersecurity and biology requests. A flagged request reruns on another model with a notice, and the session stays there until you change it. Work on pathogens such as chytrid could trigger this.</li>
  </ul>
  <div class="task"><h3>Change models</h3><p>Open the model picker and look at what your plan offers. Switch to Sonnet 5.5, then send:</p>
  <div class="cmd"><pre>Which model are you, and in two sentences, what is the difference between occupancy and abundance?</pre></div>
  <p>Now switch back to the default.</p></div>
  <div class="quiz" data-q="model1"></div>
  <div class="instr"><strong>Instructor</strong><p>Keep this short, and tell people to stay on the default today. The price column makes the size of the difference concrete. Fitting a model on a cheaper model is not rehearsed, so don't promise equal results.</p></div>
</template>

<template id="t-projects">
  <p class="eyebrow">Station 6 · 10 minutes</p>
  <h1>Manage projects and sessions</h1>
  <p class="lead">In the Code tab, a <strong>project</strong> is simply a folder on your computer, and a <strong>session</strong> is one conversation about it. Keep one folder per study, and start a new session for each new job.</p>
  <div class="shot" data-shot="sessions-sidebar"></div>
  <h2>Set up a project folder</h2>
  <p>Make a folder for the study and put your original files in <code>data_raw</code>. When you run an analysis, CascadiaTools adds the rest:</p>
  <div class="cmd"><pre>marten-occupancy/                  the folder you open in Claude
  data_raw/                        your original files, never changed
  projects/marten-winter-2026/
    data_raw/  data/               a copy of the originals, then cleaned versions
    analysis_plan.md               written before fitting
    config.yaml                    the settings that reproduce the fit
    recovery/                      planted-truth results
    results/                       report, figures, estimates
    log.md                         what was done, in order, with commands</pre></div>
  <p class="small">On Windows, avoid folders synced by OneDrive or Dropbox for active runs, and paths with unusual characters. We haven't tested synced folders.</p>
  <h2>Everyday session tasks</h2>

  <tr><td>Open a project</td><td>Click the project folder control under the prompt box, then <strong>Open folder…</strong></td></tr>
  <tr><td>Start a new session</td><td><strong>+ New</strong> in the sidebar, or Ctrl+N (Cmd+N on Mac)</td></tr>
  <tr><td>Return to earlier work</td><td>Click the session in the sidebar. It keeps its history.</td></tr>
  <tr><td>Rename a session</td><td>Open it, then click its title in the title bar</td></tr>

  <tr><td>See two sessions side by side</td><td>Right-click a session, then <strong>Open in</strong> and <strong>Split view</strong></td></tr>
  <tr><td>Bring in another folder</td><td><strong>+</strong> next to the prompt box, then <strong>Add folder</strong></td></tr>
  <tr><td>See how full a session is</td><td>Type <code>/context</code>. <code>/compact</code> summarizes the session to free space.</td></tr>
  <tr><td>See your plan usage</td><td>Click the usage ring in the row under the prompt box</td></tr>

  <p class="small">The sidebar's own <strong>Projects</strong> item is a separate feature, described below. Labels are for the current layout. If a new session shows no environment under the prompt box, you have the earlier layout, and some controls sit elsewhere.</p>
  <h2>Give each project a memory</h2>
  <p>A new session starts fresh, so it doesn't know what you decided last week. Files carry that forward: <code>analysis_plan.md</code> and <code>log.md</code> record the analysis, and a <code>CLAUDE.md</code> file in the project folder is read at the start of each session. Put what stays true about the study there.</p>

<template id="t-modules">
  <p class="eyebrow">Station 4 · 15 minutes</p>
  <h1>What can it do? 29 modules</h1>
  <p class="lead">These are the statistical models. Each module has a tested simulator, a fitting engine, figures, interpretation and a worked example. Filter by your field, read what each is for, and find the one you would use first.</p>
  <div class="tools-row"><select id="domainFilter" aria-label="Filter by area"></select><span class="seg" role="group" aria-label="Filter by verdict"><button type="button" data-v="all" aria-pressed="true">All</button><button type="button" data-v="DONE" aria-pressed="false">DONE</button><button type="button" data-v="OPEN" aria-pressed="false">OPEN</button></span><span class="small" id="modCount"></span></div>
  <div class="cards" id="modCards"></div>
  <h2>What OPEN means</h2>
  <p>The chip shows the verdict on that module's <em>worked example</em> at its design: <span id="modTally"></span>. OPEN means at least one quantity the example would report failed a check, and the example says which one and what to do. The rest of its results can often still be used.</p>
  <div class="note"><h3>Example: structural equation model on post-fire songbirds</h3><p>OPEN because 6 of 24 quantities failed. Standardized coefficients involving the bird counts ran about 17% too high. The raw paths and rate ratios passed, so the advice is to report those and use the standardized values only to rank routes.</p></div>
  <p>Your own study gets its own verdict at your design. A module that is DONE here can be OPEN for you, and the reverse.</p>
  <div class="task"><h3>Ask which module fits</h3><p>Describe a study you have run. Claude reads the catalog and names the modules that fit.</p><div class="cmd"><pre>/cascadia-tools:cascadia-start I work on [species or system]. I collect [what you record]. Which modules fit, and what data would each one need?</pre></div>
  <p class="small">Prefer clicking? The <a href="https://cascadiawildlifelab.org/tools/finder.html">module finder</a> asks two questions and gives you a starting prompt.</p></div>
  <div class="quiz" data-q="mod1"></div>

<template id="t-commands">
  <p class="eyebrow">Station 5 · 25 minutes</p>
  <h1>Every slash command</h1>
  <p class="lead">A slash command loads one set of instructions and hands it your text. All 14 CascadiaTools commands are below, along with those that manage plugins.</p>
  <h2>How to run one</h2>
  <ol class="steps">
    <li><div>Type <code>/</code> at the <strong>start</strong> of the prompt box, or click <strong>+</strong> and choose <strong>Slash commands</strong>.</div></li>
    <li><div>Keep typing to filter. <code>/eco</code> shows the protocols. Pick one, and it appears highlighted.</div></li>
    <li><div>Type your request after it and send. Claude receives both.</div></li>
  </ol>
  <div class="note"><h3>Three rules</h3><ul>
    <li><strong>Full name.</strong> Plugin commands have the form <code>/cascadia-tools:eco-power</code>. The short <code>/eco-power</code> also works unless another command uses that name.</li>
    <li><strong>First in the message.</strong> A command typed after other words doesn't run as a command.</li>
    <li><strong>Optional, mostly.</strong> You can write in plain language and Claude usually picks the right one: "How many sites do I need?" loads <code>eco-power</code>. The slash guarantees it.</li>
  </ul></div>
  <p>The one you will use most is <code>eco-analyze</code>, which calls the protocol commands in order. Use the others to run a single step, to repeat a step, or to ask for that step by name when you want it held to its rules.</p>

  <div id="cmdList" class="stack"></div>

<template id="t-first">
  <p class="eyebrow">Station 6 · 25 minutes, hands-on</p>
  <h1>Your first analysis: Wood Thrush counts</h1>
  <p class="lead">A simulated point-count study: 45 stations, 4 visits each, some counts 5 minutes and most 10. Does the number of thrushes change with canopy cover, elevation and forest type?</p>
  <div class="task"><h3>Set up the folder</h3>
    <ol>
      <li>Download <a href="https://cascadiawildlifelab.org/tools/data/glm.zip">glm.zip</a> and unzip it.</li>
      <li>In the Code tab, start a new session with the unzipped <code>glm-example</code> folder as the project.</li>
      <li>Set the mode to Manual, so you can follow along.</li>
    </ol></div>
  <div class="task"><h3>Send this prompt</h3>
    <div class="cmd"><pre>/cascadia-tools:eco-analyze I have Wood Thrush point counts in wood_thrush_counts.csv: 45 stations, each counted 4 times in May-June 2025. Most counts were 10 minutes, some were 5. I want to know whether the number of thrushes changes with canopy cover, elevation and forest type. Please analyse it and give me a report with figures I can use in a paper. I'm on a laptop, so use 4 cores.</pre></div>
    <p class="small">Rehearsal: about 4 minutes on a cluster node, with no pauses for approval. Allow 15 to 25 minutes on a laptop with permission prompts. The laptop figure is an estimate.</p></div>
  <h2>Follow along</h2>
  <ul class="check" id="firstList"></ul>
  <h2>Compare with what we got</h2>
  <figure><img data-fig="glm" alt="Four-panel conditional effects plot for Wood Thrush count against canopy cover, elevation and forest type, with 95 percent bands."><figcaption>The conditional-effects panel from the published run of this example. Your numbers should match closely if your run uses the same data and settings.</figcaption></figure>
  <div class="tbl-wrap"><table><thead><tr><th>Effect</th><th>Rate ratio (95% CI)</th><th>Reads as</th></tr></thead><tbody>
  <tr><td>Canopy cover, per 10 points</td><td class="num">1.39 (1.18 to 1.64)</td><td>39% higher expected count</td></tr>
  <tr><td>Elevation, per 100 m</td><td class="num">0.949 (0.854 to 1.05)</td><td>Compatible with no effect</td></tr>
  <tr><td>Conifer vs deciduous</td><td class="num">0.482 (0.248 to 0.935)</td><td>52% lower expected count</td></tr>
  <tr><td>Mixed vs deciduous</td><td class="num">1.15 (0.651 to 2.01)</td><td>Compatible with no effect</td></tr>
  </tbody></table></div>
  <div class="note"><h3>Notice the language</h3><p>The report says "is associated with" and avoids "affects". It avoids "significant" and gives size and interval. It says these counts combine abundance with detectability. Those are rules in <code>eco-interpretation</code>, applied every time.</p></div>
  <h2>A DONE with a failed row</h2>
  <p>This example is DONE even though two recovery rows failed: the station random-effect SD (biased 18% low) and the negative-binomial size parameter. Neither is interpreted, so neither blocks the verdict, and both are named as limits. The gate applies to the quantities you report.</p>
  <h2>Ask these five questions after every run</h2>
  <ol>
    <li>Which module did you use, and why that one?</li>
    <li>What did planted truth show at my design? Show me the bias and coverage.</li>
    <li>Did the fit converge, and what did the goodness-of-fit check say?</li>
    <li>Which results should I not interpret?</li>
    <li>Did you write any statistical code that isn't in a validated module?</li>
  </ol>
  <div class="note warn"><h3>A warning sign</h3><p>If Claude wrote a new model of its own and didn't flag it, or gives you results without a verdict, ask it to follow the gate. Custom work has to be cross-checked with a second implementation (gate step 4).</p></div>
  <div class="quiz" data-q="first1"></div>

<template id="t-lab">
  <p class="eyebrow">Station 7 · 20 minutes, in this page</p>
  <h1>Planted truth: break a model on purpose</h1>
  <p class="lead">You set the true occupancy and detection. The page simulates surveys, fits an occupancy model to each one, and applies the same gate CascadiaTools uses. Find a design that fails.</p>
  <div class="lab">
    <label for="labN">Sites <output id="oN"></output><input type="range" id="labN" min="20" max="300" step="10"></label>
    <label for="labK">Visits per site <output id="oK"></output><input type="range" id="labK" min="2" max="8" step="1"></label>
    <label for="labPsi">True occupancy ψ <output id="oPsi"></output><input type="range" id="labPsi" min="0.1" max="0.9" step="0.05"></label>
    <label for="labP">True detection p <output id="oP"></output><input type="range" id="labP" min="0.05" max="0.9" step="0.05"></label>
  </div>
  <div class="tools-row"><button class="btn" id="labRun" type="button">Run 200 simulated studies</button><button class="btn ghost" type="button" data-preset="120,4,0.4,0.4">Pileated-like design</button><button class="btn ghost" type="button" data-preset="40,2,0.4,0.2">Thin design</button><button class="btn ghost" type="button" data-preset="60,3,0.8,0.15">Rare detections</button></div>
  <div id="labOut" class="stack"></div>
  <p class="small">A teaching simulation in your browser: constant ψ and p, maximum likelihood, Wald intervals on the logit scale, seeded so results repeat. Real modules handle covariates and missing visits, and the thresholds are fixed in <code>core/R/recovery.R</code>.</p>
  <h2>The rules on that scorecard</h2>
  <div class="tbl-wrap"><table><thead><tr><th>Check</th><th>Passes when</th><th>What failure means</th></tr></thead><tbody>
  <tr><td>Bias</td><td>|bias| ≤ the larger of 10% of truth or 3 Monte Carlo SE</td><td>The method systematically over- or undershoots</td></tr>
  <tr><td>Coverage</td><td>95% intervals contain the truth at least 0.95 − 3 Monte Carlo SE of the time (floor 0.80)</td><td>Intervals are too narrow, so you would be overconfident</td></tr>
  <tr><td>Convergence</td><td>At least 90% of all attempted fits converged</td><td>The model often can't be fitted at this design</td></tr>
  </tbody></table></div>
  <p>The naive line is the negative control. Counting a site as occupied only if you detected the species ignores missed birds, so it fails unless detection is high enough that few sites are missed. A check that can't fail tells you nothing.</p>
  <h2>The seven steps of the acceptance gate</h2>
  <ol>
    <li><strong>Declare</strong> the plan before fitting real data.</li>
    <li><strong>Planted truth</strong> at this study's design, for each quantity you interpret.</li>
    <li><strong>Convergence</strong> on the real data (Bayesian: R-hat below 1.01, bulk ESS at least 400. Likelihood: converged, invertible Hessian, nothing on a boundary).</li>
    <li><strong>Model checks,</strong> such as MacKenzie-Bailey for occupancy or DHARMa for GLMs.</li>
    <li><strong>An independent route</strong> for anything new.</li>
    <li><strong>A negative control</strong> showing the check can fail.</li>
    <li><strong>Reproducible:</strong> the command, config and outputs are saved.</li>
  </ol>
  <p>Then the verdict: DONE only if every step passed; otherwise OPEN, with what failed and what it means.</p>
  <div class="task"><h3>Now try it in Claude</h3><p>Here is the planted-truth step by itself, for a thin design. It should take a few minutes on a laptop.</p>
  <div class="cmd"><pre>/cascadia-tools:eco-planted-truth For the occu-single module, check recovery at 40 sites with 2 visits each and low detection. Use 4 cores and 50 replicates so it stays short. Tell me which quantities pass the gate, and whether 50 replicates is enough to rely on.</pre></div>
  <p class="small">The acceptance gate asks for at least 100 replicates, or 50 if each fit takes minutes. Treat this short run as practice.</p></div>
  <div class="quiz" data-q="lab1"></div>
  <div class="quiz" data-q="lab2"></div>
  <div class="instr"><strong>Instructor</strong><p>Project this. Run the pileated design (should pass), then the thin design, then ask the room to predict before each run. A useful question: "How many more visits does this need?" Then let them hunt for the smallest passing design.</p></div>
</template>

<template id="t-occ">
  <p class="eyebrow">Station 8 · 25 minutes, hands-on</p>
  <h1>Worked example: pileated woodpecker occupancy</h1>
  <p class="lead">Call-playback surveys at 120 stands, up to 4 visits each. Does forest cover or elevation affect occupancy, allowing for birds that were missed?</p>
  <div class="task"><h3>Run it</h3>
    <ol><li>Download <a href="https://cascadiawildlifelab.org/tools/data/occu-single.zip">occu-single.zip</a>, unzip it, and open the <code>occu-single-example</code> folder as a new session.</li>
    <li>Send the prompt below.</li></ol>
    <div class="cmd"><pre>/cascadia-tools:eco-analyze I have pileated woodpecker call-playback surveys from 120 forest stands, up to 4 visits each in May-June 2025. The files are detections.csv (one row per visit: stand, visit number, date, day of year, observer, detected 1/0) and sites.csv (forest cover %, elevation in m, stand age). Does forest cover or elevation affect whether woodpeckers occupy a stand? Please account for birds we missed, and allow detection to change with date and observer. I need results and figures for a paper. I'm on a laptop, so use 4 cores and tell me how long the recovery check will take before you start it.</pre></div>
    <p class="small">Rehearsal with this exact prompt: 4 min 39 s to the planted-truth stop on Opus 5.5. The recovery check itself took 1 min 46 s on 4 cluster cores; a laptop may be slower. Allow more time for the fit, the report and permission prompts.</p></div>
  <div class="note warn"><h3>Expect your run to stop at planted truth</h3>
    <p>This is the course's most useful surprise. The forest cover slope really is about 11% too strong at this design, just past the 10% limit, so most short recovery checks fail it, and the protocol tells Claude to stop and ask you. If it stops, send:</p>
    <div class="cmd"><pre>This is a teaching example, so please continue. Don't change the gate. Fit the data, treat the slope sizes as a stated limit, and give me the report and your verdict.</pre></div>
    <p>Claude may also tell you the files are a simulated example and that it read the answers in them. That's accurate. It should not change a threshold or rerun with new seeds to get a pass. If it offers to, say no.</p></div>
  <h2>Read the data description first</h2>
  <p>This is the agent's first deliverable, and the one most worth your attention. It should report: 120 stands, 405 surveys, 72 stands with 4 visits, 21 with 3, and 27 with 2. Missing visits have no row and are not zeros. Woodpeckers were detected on 52 surveys at 34 stands.</p>
  <h2>Why not just count stands with detections?</h2>
  <figure><img data-fig="occ" alt="Occupancy probability rising with forest cover, from below 0.1 at low cover to about 0.6 at high cover, with a wide 95 percent band."><figcaption>Occupancy against forest cover from the example report. Going from 22% to 85% forest cover, occupancy goes from 0.09 (0.03 to 0.28) to 0.62 (0.36 to 0.81).</figcaption></figure>

  <tr><td>Stands actually occupied</td><td class="num">47 (37 to 58)</td><td>Applies to these 120 stands only</td></tr>
  <tr><td>Detection across 4 visits</td><td class="num">0.87 (0.70 to 0.96)</td><td>About 13% of occupied stands go undetected</td></tr>
  <tr><td>Detection per visit, by observer</td><td class="num">AB 0.39, JK 0.13, MR 0.52</td><td>Observer differences matter. This is detection, not habitat.</td></tr>
  <tr><td>Goodness of fit</td><td class="num">c-hat 1.31, p = 0.138</td><td>No evidence of lack of fit, though the test has low power here</td></tr>
  </tbody></table></div>
  <h2>Read the recovery table like a reviewer</h2>
  <p>These are real rows from a large planted-truth run of this example's full model: 5,000 replicates at this design.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Quantity</th><th class="num">Truth</th><th class="num">Mean estimate</th><th class="num">Rel. bias</th><th class="num">Coverage</th><th>Gate</th></tr></thead><tbody>

  <tr><td>Forest cover slope (logit)</td><td class="num">1.02</td><td class="num">1.13</td><td class="num">+10.8%</td><td class="num">0.968</td><td><span class="chip FAIL">FAIL</span></td></tr>

  </tbody></table></div>
  <h2>The same slope, three recovery runs</h2>
  <div class="tbl-wrap"><table><thead><tr><th>Run</th><th class="num">Replicates</th><th class="num">Forest slope bias</th><th class="num">Monte Carlo 95% interval</th><th>Gate</th></tr></thead><tbody>

  <div class="note"><h3>Why this example changed from DONE to OPEN</h3><p>A recovery run is itself an estimate. The first run passed by chance, because the true bias is close to the limit. When a rehearsal failed, we ran 5,000 new replicates, with the decision rule written down first, and the example's verdict changed to OPEN. The rule stayed where it was. We then did the same for eight more examples near the limits, and three more changed to OPEN. See <a href="https://cascadiawildlifelab.org/tools/validation.html#larger-runs">the validation page</a>.</p>

<template id="t-power">
  <p class="eyebrow">Station 11 · 15 minutes</p>
  <h1>Plan the next field season</h1>
  <p class="lead"><code>eco-power</code> answers "how many sites?" by simulating your design many times, using the module that will later analyze the data.</p>
  <h2>What it asks you</h2>
  <ol class="steps">
    <li><div><strong>The effect that matters for management.</strong> What change would alter a decision?</div></li>
    <li><div><strong>Nuisance values:</strong> detection, baseline occupancy or density, from a pilot or the literature. Uncertain ones become extra scenarios.</div></li>
    <li><div><strong>The knob:</strong> sites, visits, traps, years, individuals or loci, with 4 to 6 feasible values.</div></li>
  </ol>
  <h2>What it reports</h2>
  <ul>
    <li>The power curve, and the smallest design reaching 80% power.</li>
    <li><strong>Bias and coverage at each design.</strong> Power from a biased estimator means nothing, and small designs often fail coverage first.</li>
    <li>The false-positive rate with an effect of zero, which should be near 0.05.</li>
    <li>How the answer moves under other assumptions about detection.</li>
  </ul>
  <div class="task"><h3>Size a monitoring study</h3>
    <div class="cmd"><pre>/cascadia-tools:eco-power I want to monitor a forest owl with call-playback surveys. Occupancy is about 0.4, detection per visit about 0.3, and I can afford about 600 visits total. Can I detect a logit slope of 0.5 per SD of forest cover? Compare 100 sites with 6 visits, 150 with 4 and 200 with 3. I'm on a laptop, so use 4 cores, keep it under 20 minutes, and tell me how precise the result will be with that many replicates.</pre></div>
    <p class="small">200 replicates give power to about ±0.03 near 0.8. In a short workshop run you will have fewer, so read it as a rough answer.</p></div>
  <div class="note"><h3>Why this is the fastest route to value</h3><p>You don't need data yet, nothing sensitive leaves your computer, and the answer can save a field season. Many first-time users should start here.</p></div>
  <div class="quiz" data-q="pow1"></div>
  <div class="instr"><strong>Instructor</strong><p>A live power run will outlast this station. Start one at the beginning of the break and return to it, or show the module's recorded power numbers. The fixed-effort comparison in the prompt usually sparks discussion among people who run surveys.</p></div>
</template>

<template id="t-private">

  <h1>Sensitive locations and private mode</h1>
  <p class="lead">R runs on your computer. The AI model does not. Anything Claude reads or prints goes to the model provider.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Normally</th><th>With private mode</th></tr></thead><tbody>
  <tr><td>Claude can open your CSVs and see rows, coordinates and IDs</td><td>Claude sees column names, dimensions, value ranges, missing-value counts, check messages and aggregated results</td></tr>

  </tbody></table></div>

  <h2>Rehearse before the day</h2>
  <ul class="check" id="rehearseList"></ul>
  <div class="note"><h3>What was and wasn't tested for this course</h3>
    <p><strong>Run on the lab's Linux cluster, using the plugin and the website's example zips:</strong> Wood Thrush through Claude (the run was accidentally sent with the command and no prompt text, so Claude took the prompt from <code>START_HERE.txt</code>; the laptop wording was not tested there); woodpecker through Claude with the exact prompt, to the planted-truth stop; the setup self-test (11 s); a direct woodpecker fit; the JWM figure settings; and the private-mode guard, against 23 cases that matched the previous guard, plus PowerShell commands. Both Claude rehearsals used Opus 5.5 and predate the 0.2.1 fixes. <strong>Not tested:</strong> the desktop app itself, Windows, macOS, a clean package install, a real laptop, other Claude models, the follow-up and eco-figures prompts through Claude, the prompts on the Planted-truth, Power, Meet Claude, Model and Projects stations, the private-mode skill from end to end, and most slash commands run live. Screen labels and diagrams come from Anthropic's documentation (November 2026) and your own install.</p>
  </div>
  <div class="note warn"><h3>Windows is still the largest risk</h3>
    <p>Version 0.2.1 fixes what we could find, but none of it has run on Windows. Fixed and tested on Linux by simulating Windows conditions: the run scripts now find R in its usual Windows folders; parallel recovery and power runs use socket workers, because Windows has no forking (same estimates as forked workers, to the last digit, on two modules, and a Nimble module ran without errors); and the private-mode guard runs in R, covers PowerShell, and refuses tool calls if it can't run. Still required: Git for Windows, which provides the Bash shell the run scripts need. Socket workers also start more slowly, and each one compiles its own Nimble model, so Bayesian runs will take longer on Windows.</p></div>

  <h2>Fallbacks in the room</h2>
  <div class="tbl-wrap"><table><thead><tr><th>Problem</th><th>Plan</th></tr></thead><tbody>
  <tr><td>Someone's install isn't finished</td><td>Pair them with a neighbor. The Meet Claude, Modules and Slash commands stations and the planted-truth lab work without an install.</td></tr>
  <tr><td>Wi-Fi is overloaded</td><td>Have the two example zips on USB sticks. Claude still needs a connection, so tether your own machine and project it.</td></tr>
  <tr><td>Rate or usage limits</td><td>Switch people to reading the example results on the website, and continue with the lab.</td></tr>
  <tr><td>A live run stalls</td><td>Open your rehearsal copy of the report. Keep finished results from each example on your machine.</td></tr>
  <tr><td>A hands-on run gives different numbers</td><td>Good discussion. Same data and config should match closely; ask Claude what differed. The agent's route can vary, so check the module and config it used.</td></tr>
  </tbody></table></div>
  <h2>Questions you will get</h2>
  <div class="stack">
    <div class="note"><h3>"Does my data go to Anthropic?"</h3><p>Whatever Claude reads or prints does. R itself runs locally. Private mode narrows what is read. Terms depend on the account type, so check your institution's terms.</p></div>
    <div class="note"><h3>"Can I use this with ChatGPT or Codex?"</h3><p>Today the packaged plugin targets Claude Code. The modules are ordinary R code and the protocols are written instructions, so other agents could use them, but that route hasn't been packaged or tested.</p></div>
    <div class="note"><h3>"Why are so many examples OPEN?"</h3><p>Because we tested the borderline ones harder, and reported what we found. Most OPEN verdicts name one quantity or a slightly narrow interval, and the rest of the example can still be used. Examples not rerun at large size haven't had this stricter test.</p></div>
    <div class="note"><h3>"Who checked the code?"</h3><p>Independent verifier agents reviewed each module against recorded recovery results, and problems found and fixed are tallied on the validation page. Humans should keep checking. The code is public, and problem reports are welcome.</p></div>
    <div class="note"><h3>"Will a reviewer accept this?"</h3><p>The engines are established packages (unmarked, glmmTMB, Nimble, secr and others), and the report gives a methods paragraph with citations. Disclose the agent's role and report the recovery results. Journal AI policies vary.</p></div>
    <div class="note"><h3>"Does it replace a biometrician?"</h3><p>No. It handles standard models with checks. Hard design questions and new models still benefit from one, and the OPEN verdicts make a good agenda for that conversation.</p></div>
  </div>

const store={get(k,d){try{const v=localStorage.getItem('ct-'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('ct-'+k,JSON.stringify(v))}catch(e){}},clear(){try{Object.keys(localStorage).filter(k=>k.startsWith('ct-')).forEach(k=>localStorage.removeItem(k))}catch(e){}}};

function save(k){store.set(k,state[k])}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtCode=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');

const QUIZ={
 meet1:{q:'Claude gives you a citation that looks exactly right. What should you do?',o:['Use it, because it has a journal and a DOI','Look it up yourself before relying on it','Ask Claude if it is sure, and accept its answer'],a:1,w:'Claude can produce convincing citations that don\'t exist. Asking it again doesn\'t check anything; looking it up does.'},
 model1:{q:'You switch from Opus 5.5 to Sonnet 5.5 and refit the same module with the same config. What changes?',o:['The statistical code in the module','How the agent works around the code; the estimates should match','The planted-truth thresholds'],a:1,w:'The numbers come from R and the module code. The model affects how the agent chooses, checks and explains.'},
 proj1:{q:'You come back next week and start a new session on your project. How does Claude know your earlier decisions?',o:['It remembers every past session automatically','From files in the folder, such as CLAUDE.md, analysis_plan.md and log.md','It doesn\'t, and you have to start the analysis over'],a:1,w:'Each session has its own history. Project files carry decisions forward, and you can reopen the old session from the sidebar.'},
 why1:{q:'A model ran with no errors and gave narrow intervals. What does that show?',o:['The estimate is probably right','Very little: ecological models can fail silently','The data met the assumptions'],a:1,w:'Running is the lowest bar. An occupancy fit with too few surveys can return ψ = 1.00 with a tiny SE and no error.'},
 inst1:{q:'You type /plugin and Claude treats it as an ordinary message or says it is unknown. What is most likely?',o:['R isn\'t installed','You are in the Chat tab, not the Code tab','The marketplace was removed'],a:1,w:'Plugins live in Claude Code. Use the Code tab with a Local environment.'},
 desk1:{q:'Which setting decides that R runs on your own computer?',o:['The permission mode','The environment set to Local','The model picker'],a:1,w:'A Local environment runs on your machine. Plugins installed in the desktop app are not available in cloud sessions.'},
 mod1:{q:'An example\'s chip says OPEN. What should you conclude?',o:['The module is broken, so avoid it','At least one reported quantity failed a check at that design; read which one','The analysis isn\'t finished running'],a:1,w:'OPEN names what failed and what can still be used. Your own design gets its own verdict.'},
 first1:{q:'Canopy cover has a rate ratio of 1.39 (1.18 to 1.64). Which sentence fits the rules?',o:['Canopy cover significantly increases thrush abundance by 39%','Each 10 points of canopy is associated with a 39% higher expected count (1.18 to 1.64)','Thrushes prefer canopy cover'],a:1,w:'Response scale, meaningful unit, interval, associational wording. Counts also mix abundance with detectability.'},
 lab1:{q:'Bias passes but coverage is 0.78. What is wrong?',o:['Nothing, since the average is right','Intervals are too narrow, so you would be overconfident','Too few chains'],a:1,w:'Coverage says how often intervals contain the truth. Unbiased estimates with bad intervals still fail.'},
 lab2:{q:'The planted-truth check passes. Have you shown your real estimate is right?',o:['Yes','No: it shows the method can recover truth at this design if its assumptions hold','Only if p < 0.05'],a:1,w:'Your real data can still break assumptions. That\'s why convergence and goodness-of-fit checks follow.'},
 occ1:{q:'Observer JK detected at 0.13 and MR at 0.52. How should you describe this?',o:['Occupancy was lower at JK\'s sites','A difference in detection, separate from where birds occur','An error in the data'],a:1,w:'The model puts this in the detection process. Keep effects in the process they belong to when you write them up.'},
 gal1:{q:'Bobcat cameras on trails had 3.2 times the odds of detection. Does that mean bobcats live near trails?',o:['Yes','No: it is a detection effect, not a difference in where animals live','Only in winter'],a:1,w:'Trail placement changes how easily animals are recorded. The report states this directly.'},
 fig1:{q:'You want to change a figure from single- to double-column. What is needed?',o:['Refit the model','A change to the figure config, then a redraw from the saved fit','A new planted-truth run'],a:1,w:'Figures are drawn from the saved fit. You never refit to change a figure.'},
 pow1:{q:'A design reaches 85% power, but coverage there is 0.70. What do you do?',o:['Accept it, since power is above 80%','Reject it: power from a miscalibrated estimator is meaningless','Lower the alpha level'],a:1,w:'Check that the estimator works at each design before reading its power.'},
 priv1:{q:'Which is still sent to the model provider with private mode on?',o:['Raw rows from data_raw','Summaries, column names, error messages, estimates and figures','Nothing at all'],a:1,w:'Private mode keeps raw records out of the conversation. Summaries and results are still sent.'},
 own1:{q:'Your covariate was measured after the response, and you ask a causal question. Which step should catch this?',o:['eco-figures','eco-data-intake and eco-analysis-plan','/reload-plugins'],a:1,w:'Intake flags covariates measured after the response. The plan decides what a causal reading would need, using the causal module.'},
};

const P='/cascadia-tools:';
const COMMANDS=[
 {g:'Start and set up',items:[
  {c:P+'cascadia-start',when:'You are new, or want to know what fits your work.',does:'Checks setup, explains the workflow, names 1 to 3 modules for your work, and offers to run a worked example.',t:P+"cascadia-start I study amphibians in wetlands. What fits?",alt:'"Show me what CascadiaTools can do"',kw:'help orientation begin example new'},
  {c:P+'cascadia-setup',when:'First use, a module says packages are missing, or you want to update packages.',does:'Checks R 4.5+ and the compiler, installs R packages in the background (20 to 40 minutes), and runs a self-test. Asks about sensitive data.',t:P+'cascadia-setup',alt:'"Set up CascadiaTools"',kw:'install packages r compiler rtools error'},
  {c:P+'cascadia-private',when:'Data include sensitive locations or are under an agreement.',does:'Asks which folders are sensitive, writes `.cascadia/private.json` and read-deny rules, and states what is and isn\'t protected.',t:P+'cascadia-private My files are in data_raw.',alt:'"Turn on private mode"',watch:'Test the block yourself. These are pattern-based guards, not a security boundary.',kw:'sensitive confidential agreement privacy owl nest'},
 ]},
 {g:'The whole analysis',items:[
  {c:P+'eco-analyze',when:'You have data and a question. This is your default.',does:'Runs the whole workflow: project folder, intake, module choice, plan, planted truth, fit, checks, interpretation, verdict, and delivery of a report and methods paragraph.',t:P+'eco-analyze Here are my camera data in data_raw. Estimate density and whether it changes with canopy.',alt:'Describe your data and question',kw:'full end to end report analysis question'},
 ]},
 {g:'The protocol, one step at a time (in order)',items:[
  {c:P+'eco-data-intake',when:'New files arrive, or a colleague sent a dataset you don\'t trust yet.',does:'Copies originals to `data_raw/`, describes the data back to you, runs the module\'s checks, and looks for traps such as NA vs 0, mismatched site IDs and wrong units.',t:P+'eco-data-intake Check these detection histories before we do anything.',alt:'"Check my data"',kw:'clean check files missing na zero'},
  {c:P+'eco-analysis-plan',when:'Before fitting, or when the question changes.',does:'Writes `analysis_plan.md`: estimand, module, covariates with biological reasons, priors, checks and model selection decided in advance.',t:P+'eco-analysis-plan Does logging reduce marten occupancy? Write the plan, and tell me what would justify a causal reading.',alt:'"Write an analysis plan"',kw:'preregister covariates estimand causal dag'},
  {c:P+'eco-planted-truth',when:'Before any real-data fit, or after changing a model or its settings.',does:'Simulates data at your design with known values, refits many times, and reports bias, coverage and convergence against the gate.',t:P+'eco-planted-truth Check recovery at my design: 60 sites, 3 visits, detection around 0.3.',alt:'"Can this method work for my design?"',watch:'Bayesian modules can take hours. Ask for a timing test first.',kw:'simulate recovery bias coverage trust validate'},
  {c:P+'eco-convergence',when:'After a fit, or a result looks odd.',does:'Applies the thresholds: R-hat below 1.01, ESS at least 400, no divergences, no boundary estimates, N not piling up against M. Suggests fixes in order.',t:P+'eco-convergence Check my last fit. Can I report these estimates?',alt:'"Did this converge?"',kw:'rhat ess mcmc chains boundary hessian'},
  {c:P+'eco-model-checking',when:'After convergence, before interpreting.',does:'Runs the check that suits the model: DHARMa, MacKenzie-Bailey, posterior predictive checks, pseudo-residuals, d-separation, HWE. Reports the statistic and its meaning.',t:P+'eco-model-checking Does the model fit? Explain any failed check.',alt:'"Does the model fit?"',kw:'goodness of fit gof dharma c-hat residuals'},
  {c:P+'eco-interpretation',when:'Writing results, or you want to know what a number means.',does:'Applies the writing rules: response scale, meaningful units, intervals always, associational wording, detection kept apart from ecology, limits stated.',t:P+'eco-interpretation Write the results paragraph, and explain what an odds ratio of 1.54 means here.',alt:'"What does this mean?"',kw:'write results paragraph meaning odds ratio language'},
  {c:P+'eco-acceptance-gate',when:'A result is about to go in a report, or you want the verdict explained.',does:'Goes through the seven gate steps and gives DONE or OPEN, with what failed and what it means.',t:P+'eco-acceptance-gate Is this analysis done? Explain the verdict.',alt:'"Is this done?"',kw:'verdict done open standard finished'},
 ]},
 {g:'Products and extensions',items:[
  {c:P+'eco-figures',when:'You need figures for a paper, talk or report, or want to change one.',does:'Translates your request into figure settings and redraws from the saved fit, checks the result, and hands over files, captions and the config.',t:P+'eco-figures Make these JWM size, greyscale, with percent on the x axis.',alt:'"Change this figure"',kw:'journal plot greyscale color pdf tiff slide jwm'},
  {c:P+'eco-power',when:'You are designing a study, or asking "how many sites?".',does:'Simulates across a grid of designs. Reports the power curve, bias and coverage at each design, false-positive rate, and sensitivity.',t:P+'eco-power How many stands do I need to detect a 20% decline in occupancy?',alt:'"How many sites do I need?"',kw:'sample size design how many sites traps loci years'},
  {c:P+'eco-new-module',when:'No module fits your question.',does:'Reads the primary literature, writes the equations, simulator and fit, then runs recovery, negative controls and a cross-check, and writes the validation record.',t:P+'eco-new-module I need a zero-truncated model for [your case]. Start from the primary literature.',alt:'"No module fits; can you add one?"',watch:'Advanced and slow. Results are unverified until the gate passes.',kw:'extend build custom model'},

/* ---------- Planted-truth lab: a pure simulation, checked outside the page ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const logit=x=>Math.log(x/(1-x)),inv=x=>1/(1+Math.exp(-x));
function lchoose(K,k){let s=0;for(let i=1;i<=k;i++)s+=Math.log((K-k+i)/i);return s}
function nll(a,b,hist,K){const psi=inv(a),p=inv(b);let s=0;for(let k=0;k<=K;k++){if(!hist[k])continue;const lb=lchoose(K,k)+k*Math.log(p)+(K-k)*Math.log1p(-p);const pr=k>0?psi*Math.exp(lb):psi*Math.exp(lb)+(1-psi);s-=hist[k]*Math.log(pr)}return s}
function fitOcc(hist,K){
  const n=hist.reduce((a,b)=>a+b,0),det=n-hist[0];if(det===0)return{conv:false};
  let best=Infinity,a=0,b=0;
  for(let i=-5;i<=5;i+=.5)for(let j=-5;j<=5;j+=.5){const v=nll(i,j,hist,K);if(v<best){best=v;a=i;b=j}}
  const h=1e-3;let ok=false,H=[0,0,0];
  for(let it=0;it<40;it++){
    const f=nll(a,b,hist,K),fa=nll(a+h,b,hist,K),fA=nll(a-h,b,hist,K),fb=nll(a,b+h,hist,K),fB=nll(a,b-h,hist,K),fab=nll(a+h,b+h,hist,K),faB=nll(a+h,b-h,hist,K),fAb=nll(a-h,b+h,hist,K),fAB=nll(a-h,b-h,hist,K);
    const ga=(fa-fA)/(2*h),gb=(fb-fB)/(2*h),Haa=(fa-2*f+fA)/(h*h),Hbb=(fb-2*f+fB)/(h*h),Hab=(fab-faB-fAb+fAB)/(4*h*h);
    H=[Haa,Hab,Hbb];const det2=Haa*Hbb-Hab*Hab;
    if(!(det2>1e-8&&Haa>0)){let da=-Math.sign(ga)*.2,db=-Math.sign(gb)*.2;a+=da;b+=db;if(Math.abs(a)>12||Math.abs(b)>12)break;continue}
    let da=-(Hbb*ga-Hab*gb)/det2,db=-(-Hab*ga+Haa*gb)/det2;const m=Math.max(Math.abs(da),Math.abs(db));if(m>1){da/=m;db/=m}
    let st=1;while(st>1e-3&&nll(a+st*da,b+st*db,hist,K)>f+1e-10)st/=2;a+=st*da;b+=st*db;
    if(Math.abs(a)>12||Math.abs(b)>12)break;
    if(Math.hypot(ga,gb)<1e-4){ok=true;break}
  }
  const det3=H[0]*H[2]-H[1]*H[1];
  if(!ok||!(det3>0)||Math.abs(a)>6||Math.abs(b)>6)return{conv:false};
  const se=Math.sqrt(H[2]/det3);if(!isFinite(se)||se>10)return{conv:false};
  return{conv:true,psi:inv(a),lo:inv(a-1.96*se),hi:inv(a+1.96*se),p:inv(b)};
}
function runLab(n,K,psi,p,nsim,seed){
  const u=rng(seed),est=[],naive=[];let cover=0,nc=0;
  for(let s=0;s<nsim;s++){
    const hist=new Array(K+1).fill(0);
    for(let i=0;i<n;i++){let y=0;if(u()<psi)for(let k=0;k<K;k++)if(u()<p)y++;hist[y]++}
    naive.push(1-hist[0]/n);
    const f=fitOcc(hist,K);
    if(f.conv){nc++;est.push(f.psi);if(f.lo<=psi&&psi<=f.hi)cover++}
  }
  const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
  const summ=(a)=>{const m=mean(a),sd=Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1));return{m,mcse:sd/Math.sqrt(a.length),rel:(m-psi)/psi}};
  const r=nc>1?summ(est):null,nv=summ(naive);
  const covBound=nc?Math.max(.8,.95-3*Math.sqrt(.95*.05/nc)):.8,cov=nc?cover/nc:0,conv=nc/nsim;
  const bPass=r&&Math.abs(r.m-psi)<=Math.max(.1*psi,3*r.mcse),cPass=nc>0&&cov>=covBound,vPass=conv>=.9;
  return{est,naive,r,nv,cov,covBound,conv,bPass,cPass,vPass,pass:bPass&&cPass&&vPass,nsim,nvPass:Math.abs(nv.m-psi)<=Math.max(.1*psi,3*nv.mcse)};
}
if(typeof module!=='undefined'){module.exports={runLab,fitOcc}}

  sel.innerHTML='<option value="">All areas</option>'+domains.map(d=>'<option>'+esc(d)+'</option>').join('');
  let v='all';const draw=()=>{const list=MODULES.filter(m=>(!sel.value||m.domain===sel.value)&&(v==='all'||m.verdict===v));document.getElementById('modCount').textContent=list.length+' of '+MODULES.length;
    document.getElementById('modCards').innerHTML=list.map(m=>'<article class="card"><div class="tools-row"><h3>'+esc(m.title)+'</h3><span class="chip '+m.verdict+'">'+m.verdict+'</span></div><p class="small">'+esc(m.domain)+' · <code>'+esc(m.id)+'</code></p><p><strong>Use it for:</strong> '+esc(m.when)+'</p><p class="small"><strong>Example:</strong> '+esc(m.ex)+'.</p>'+(m.verdict==='OPEN'&&m.reason?'<p class="small"><strong>Why OPEN:</strong> '+esc(m.reason)+'...</p>':'')+'<p class="small"><a href="https://cascadiawildlifelab.org/tools/modules/'+m.id+'.html">Full results</a> · <a href="https://cascadiawildlifelab.org/tools/data/'+m.id+'.zip">Example data (zip)</a></p></article>').join('')};
  const tally=MODULES.filter(m=>m.verdict==='DONE').length;document.getElementById('modTally').textContent=tally+' DONE and '+(MODULES.length-tally)+' OPEN';
  sel.addEventListener('change',draw);
  document.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>{v=b.dataset.v;document.querySelectorAll('[data-v]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()}));draw();
}
function renderGallery(){document.getElementById('galleryCards').innerHTML=GALLERY.map(g=>{const m=MODULES.find(x=>x.id===g.id)||{verdict:'DONE'};return '<article class="card"><div class="tools-row"><h3>'+esc(g.t)+'</h3><span class="chip '+m.verdict+'">'+m.verdict+'</span></div><figure><img data-fig="'+g.fig+'" alt="Key figure from the '+esc(g.t)+' worked example."></figure><p>'+esc(g.body)+'</p><p class="small"><strong>Time:</strong> '+esc(g.time)+'. <strong>Limit:</strong> '+esc(g.limit)+'</p><p class="small"><a href="https://cascadiawildlifelab.org/tools/data/'+g.id+'.zip">Download '+g.id+'.zip</a> · <a href="https://cascadiawildlifelab.org/tools/modules/'+g.id+'.html">Full results</a></p></article>'}).join('')}
function dotPlot(vals,truth,cls,label){
  const W=460,H=112,top=20,base=H-22,x=v=>14+v*(W-28),bins={};
  vals.forEach(v=>{const b=Math.round(v*100);bins[b]=(bins[b]||0)+1});
  const mx=Math.max(1,...Object.values(bins)),step=Math.min(3.2,(base-top-3)/mx);let dots='';
  Object.entries(bins).forEach(([b,c])=>{for(let k=1;k<=c;k++)dots+='<circle class="'+cls+'" cx="'+x(b/100).toFixed(1)+'" cy="'+(base-k*step).toFixed(1)+'" r="1.4"/>'});
  let ticks='';for(let t=0;t<=1.001;t+=.2)ticks+='<line class="ax" x1="'+x(t)+'" x2="'+x(t)+'" y1="'+base+'" y2="'+(base+4)+'"/><text x="'+x(t)+'" y="'+(H-5)+'" text-anchor="middle">'+t.toFixed(1)+'</text>';
  return '<svg class="labviz" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(label)+'" style="width:100%;height:auto;display:block"><text x="14" y="11">'+esc(label)+'</text><line class="ax" x1="14" x2="'+(W-14)+'" y1="'+base+'" y2="'+base+'"/>'+ticks+dots+'<line class="truth" x1="'+x(truth)+'" x2="'+x(truth)+'" y1="'+top+'" y2="'+base+'"/></svg>';
}
function drawLab(){
  const n=+labN.value,K=+labK.value,psi=+labPsi.value,p=+labP.value,R=runLab(n,K,psi,p,200,20261104);
  const chip=x=>'<span class="chip '+(x?'PASS':'FAIL')+'">'+(x?'PASS':'FAIL')+'</span>',pc=x=>(x>=0?'+':'−')+Math.abs(x*100).toFixed(1)+'%';
  const star=1-Math.pow(1-p,K);
  document.getElementById('labOut').innerHTML='<div class="tools-row"><strong>Verdict for occupancy at this design:</strong><span class="chip '+(R.pass?'DONE':'OPEN')+'">'+(R.pass?'PASS':'FAIL')+'</span><span class="small">An occupied site is detected at least once with probability '+star.toFixed(2)+'.</span></div>'+
   '<div class="tbl-wrap"><table><thead><tr><th>Estimator</th><th class="num">Truth</th><th class="num">Mean</th><th class="num">Rel. bias</th><th>Bias</th><th class="num">Coverage</th><th>Coverage check</th><th class="num">Converged</th><th>Convergence check</th></tr></thead><tbody>'+
   '<tr><td>Occupancy model</td><td class="num">'+psi.toFixed(2)+'</td><td class="num">'+(R.r?R.r.m.toFixed(3):'n/a')+'</td><td class="num">'+(R.r?pc(R.r.rel):'n/a')+'</td><td>'+chip(R.bPass)+'</td><td class="num">'+R.cov.toFixed(3)+' (needs '+R.covBound.toFixed(3)+')</td><td>'+chip(R.cPass)+'</td><td class="num">'+Math.round(R.conv*200)+'/200</td><td>'+chip(R.vPass)+'</td></tr>'+
   '<tr><td>Naive (detected ÷ sites)</td><td class="num">'+psi.toFixed(2)+'</td><td class="num">'+R.nv.m.toFixed(3)+'</td><td class="num">'+pc(R.nv.rel)+'</td><td>'+chip(R.nvPass)+'</td><td class="num">n/a</td><td></td><td class="num">n/a</td><td></td></tr></tbody></table></div>'+
   dotPlot(R.est,psi,'dotm','Occupancy model: converged studies (gold line = truth)')+dotPlot(R.naive,psi,'dotn','Naive: all 200 studies (gold line = truth)');
}
let labN,labK,labPsi,labP;
function setupLab(){
  labN=document.getElementById('labN');labK=document.getElementById('labK');labPsi=document.getElementById('labPsi');labP=document.getElementById('labP');
  const set=(a)=>{[labN.value,labK.value,labPsi.value,labP.value]=a;sync()};
  const sync=()=>{oN.textContent=labN.value;oK.textContent=labK.value;oPsi.textContent=(+labPsi.value).toFixed(2);oP.textContent=(+labP.value).toFixed(2)};
  const oN=document.getElementById('oN'),oK=document.getElementById('oK'),oPsi=document.getElementById('oPsi'),oP=document.getElementById('oP');
  [labN,labK,labPsi,labP].forEach(e=>e.addEventListener('input',sync));
  document.getElementById('labRun').addEventListener('click',drawLab);
  document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{set(b.dataset.preset.split(',').map(Number));drawLab()}));
  set([120,4,.4,.4]);drawLab();
}
function setupPrompt(){
  const ids=['pSpecies','pMethod','pFiles','pQuestion','pOut','pCores','pPrivate'],el=id=>document.getElementById(id);
  const draw=()=>{const pv=el('pPrivate').checked;el('promptOut').textContent=(pv?P+'cascadia-private My sensitive files are in data_raw.\n\nThen, in the next message:\n\n':'')+P+'eco-analyze I have '+el('pSpecies').value+' data from '+el('pMethod').value+'. The files are '+el('pFiles').value+'. My question: '+el('pQuestion').value+' Please check the method at my design first, and give me '+el('pOut').value+'. '+el('pCores').value};
  ids.forEach(i=>el(i).addEventListener('input',draw));el('pPrivate').addEventListener('change',draw);draw();
  checklist(el('ownList'),'own',OWNCHECKS);
}
function wrapStats(){
  const qs=Object.values(state.quiz),ms=Object.values(state.match),right=[...qs,...ms].reduce((a,b)=>a+b,0),n=qs.length+ms.length;
  document.getElementById('finalScore').textContent=n?('First-try score: '+right+' of '+n):'Answer the check questions to see a score';
  document.getElementById('cheatBody').innerHTML=CHEAT.map(c=>'<tr><td>'+esc(c[0])+'</td><td><code>'+esc(c[1])+'</code></td></tr>').join('');
}
function drawRail(cur){
  const list=document.getElementById('stations');
  list.innerHTML=LESSONS.map(([id,name],i)=>{const n=id==='welcome'?'·':id==='instructor'?'★':i;const c=COUNTED.includes(id);return '<li class="'+(state.done[id]?'done':'')+'"><a href="#'+id+'" '+(id===cur?'aria-current="page"':'')+'><span class="n">'+n+'</span><span>'+name+'</span><span class="d">'+(c?(state.done[id]?'1':'0'):'')+'</span></a></li>'}).join('');
  const h=COUNTED.map(id=>state.done[id]?'1':'0').join(''),k=COUNTED.filter(id=>state.done[id]).length;
  document.getElementById('history').textContent=h;document.getElementById('historyLabel').textContent='Your detection history: '+k+' of '+COUNTED.length+' stations';
}
function route(){
  let id=(location.hash||'#welcome').slice(1);if(!LESSONS.some(l=>l[0]===id))id='welcome';
  const t=document.getElementById('t-'+id);const art=document.createElement('article');art.className='lesson';art.appendChild(t.content.cloneNode(true));
  const i=LESSONS.findIndex(l=>l[0]===id),prev=LESSONS[i-1],next=LESSONS[i+1],counted=COUNTED.includes(id);
  const pg=document.createElement('div');pg.className='pager';pg.innerHTML=(prev?'<a href="#'+prev[0]+'">← '+prev[1]+'</a>':'<span></span>')+(counted?'<button class="btn" id="finish" type="button">'+(state.done[id]?'Finished ✓ (click to undo)':'Mark finished and continue')+'</button>':(next?'<a href="#'+next[0]+'">'+next[1]+' →</a>':'<span></span>'));art.appendChild(pg);
  const eb=art.querySelector('.eyebrow');if(eb)eb.textContent=eb.textContent.replace(/^Station \d+/,'Station '+i);
  main.innerHTML='';main.appendChild(art);enhance(art);
  if(id==='install'){document.querySelectorAll('[data-os]').forEach(b=>b.addEventListener('click',()=>setOS(b.dataset.os)));setOS(state.os)}
  if(id==='modules')renderModules();
  if(id==='commands'){document.getElementById('cmdSearch').addEventListener('input',renderCmds);renderCmds();renderMatch()}
  if(id==='first')checklist(document.getElementById('firstList'),'first',FIRSTCHECKS);
  if(id==='lab')setupLab();
  if(id==='gallery'){renderGallery();enhance(art)}
  if(id==='own')setupPrompt();
  if(id==='wrap')wrapStats();
  if(id==='instructor'){checklist(document.getElementById('rehearseList'),'reh',REHEARSE);
    document.getElementById('shotList').innerHTML=Object.entries(SHOTS).map(([k,v])=>'<tr><td><code>'+k+'.png</code></td><td>'+esc(v.take)+'</td></tr>').join('');
    document.getElementById('shotPrompt').textContent='Help me take screenshots of the Claude desktop app for a public tutorial. Use a practice folder and hide anything personal. Save each as a PNG with the file name shown:\n'+Object.entries(SHOTS).map(([k,v])=>'- '+k+'.png: '+v.take).join('\n')+'\nTell me which you could not capture, and any label that differs from these descriptions.'}
  const f=document.getElementById('finish');if(f)f.addEventListener('click',()=>{const was=state.done[id];state.done[id]=!was;save('done');if(!was&&next&&next[0]!=='instructor')location.hash=next[0];else{route()}});
  drawRail(id);window.scrollTo(0,0);
}
const teach=document.getElementById('teach');teach.checked=store.get('teach',false);document.body.classList.toggle('teach',teach.checked);
teach.addEventListener('change',()=>{document.body.classList.toggle('teach',teach.checked);store.set('teach',teach.checked)});
document.getElementById('reset').addEventListener('click',()=>{store.clear();state={done:{},quiz:{},checks:{},os:'win',match:{}};route()});
addEventListener('hashchange',route);route();
</script>
